<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Projects</title>
    <script src="index.js" defer></script>
</head>
<body>
    <h1> CALCULATOR </h1>
    <div class="calculator">
    <!-- Display Box -->
    <div id="display">0</div>

    <!-- Buttons Grid -->
    <div class="buttons-grid">
        <button class="btn-clear">AC</button>
        <button class="btn-operator" data-op="/">/</button>
        <button class="btn-operator" data-op="*">*</button>
        <button class="btn-operator" data-op="-">-</button>

        <button class="btn-num" data-num="7">7</button>
        <button class="btn-num" data-num="8">8</button>
        <button class="btn-num" data-num="9">9</button>
        <button class="btn-operator" data-op="+">+</button>

        <!-- and so on for other numbers... -->
        
        <button class="btn-equals">=</button>
    </div>
</div>
    
</body>
</html>
